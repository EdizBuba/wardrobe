name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wardrobe
          POSTGRES_USER: wardrobe
          POSTGRES_PASSWORD: wardrobe
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U wardrobe" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://wardrobe:wardrobe@localhost:5432/wardrobe
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report
            test-results
  images:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish immutable application and migration images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          digest=$(find prisma/migrations -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)
          docker build --pull --target runner --build-arg VCS_REF="$GITHUB_SHA" -t "ghcr.io/edizbuba/wardrobe:$GITHUB_SHA" .
          docker build --target migrate --build-arg VCS_REF="$GITHUB_SHA" --build-arg MIGRATIONS_DIGEST="$digest" -t "ghcr.io/edizbuba/wardrobe-migrate:$GITHUB_SHA" .
          bash scripts/production/smoke-images.sh "$GITHUB_SHA"
          docker push "ghcr.io/edizbuba/wardrobe:$GITHUB_SHA"
          docker push "ghcr.io/edizbuba/wardrobe-migrate:$GITHUB_SHA"
  deploy:
    needs: images
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: wardrobe-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy through restricted SSH account
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_PASSPHRASE: ${{ secrets.PRODUCTION_SSH_PASSPHRASE }}
          KNOWN_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_PASSPHRASE" && test -n "$KNOWN_HOSTS"
          latest=$(curl --fail --silent --show-error -H "Authorization: Bearer $GHCR_READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" | jq -r .sha)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit is on main; skipping this older deployment.'
            exit 0
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/wardrobe-ssh"
          key="$RUNNER_TEMP/wardrobe-ssh/key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/wardrobe-ssh/known_hosts"
          # The key remains encrypted on disk; its passphrase is supplied to the agent.
          printf '#!/bin/sh\nprintf "%%s\\n" "$DEPLOY_PASSPHRASE"\n' > "$RUNNER_TEMP/wardrobe-ssh/askpass"
          chmod 700 "$RUNNER_TEMP/wardrobe-ssh/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null; rm -rf -- "$RUNNER_TEMP/wardrobe-ssh"' EXIT
          DISPLAY=:0 SSH_ASKPASS_REQUIRE=force SSH_ASKPASS="$RUNNER_TEMP/wardrobe-ssh/askpass" ssh-add "$key" </dev/null
          printf '%s\n' "$GHCR_READ_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/wardrobe-ssh/known_hosts" -o IdentitiesOnly=yes -i "$key" wardrobe-deploy@51.68.243.77 "deploy $GITHUB_SHA"
