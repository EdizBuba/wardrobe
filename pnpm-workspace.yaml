overrides:
  # Prisma 7.10 pins the vulnerable merger; retain Prisma's stable public API.
  "@prisma/config>deepmerge-ts": "8.0.2"
  # Fix auth-plugin downgrade and compressed-protocol DoS advisories.
  mysql2: "3.24.6"

allowBuilds:
  "@prisma/engines": true
  prisma: true
  sharp: true
  esbuild: true
  unrs-resolver: true
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-arm": true
  "@embedded-postgres/linux-ia32": true
  "@embedded-postgres/linux-ppc64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/darwin-arm64": true
